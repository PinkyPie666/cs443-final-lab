<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CS443 Final Lab</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><meta name="theme-color" content="#EEF2FB"><meta name="description" content="แอปติวสอบ Final CS443 Data Warehousing: บทเรียน Star → Snowflake ปรนัย ข้อเขียน การ์ด สอบจำลอง"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Final Lab"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{
  --ink:#141C36; --ink2:#2B3556; --mut:#66708F; --soft:#97A1BD; --line:#E7EBF6;
  --p1:#5568FF; --p2:#8B5CF6; --p3:#27C3E6;
  --ok:#0FB586; --okbg:#E3F8F0; --bad:#EF4F67; --badbg:#FDEBEE; --warn:#F4A11D; --warnbg:#FFF3DD;
  --tint:#F1F4FD; --tint2:#E8ECFB;
  --card:rgba(255,255,255,.88);
  --sh1:0 1px 2px rgba(34,48,120,.05),0 10px 28px -10px rgba(34,48,120,.16);
  --sh2:0 2px 4px rgba(34,48,120,.06),0 28px 54px -18px rgba(34,48,120,.28);
  --shp:0 12px 26px -10px rgba(85,104,255,.65),0 2px 6px rgba(85,104,255,.25);
  --r:26px; --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans Thai","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:#EEF2FB;min-height:100vh;overflow-x:hidden;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
textarea,input{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#F1F4FD 0%,#F8F6FF 55%,#EEF6FB 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.bg i:nth-child(1){width:420px;height:420px;left:-140px;top:-100px;background:#BFC8FF}
.bg i:nth-child(2){width:360px;height:360px;right:-130px;top:180px;background:#E3D2FF}
.bg i:nth-child(3){width:380px;height:380px;left:10%;bottom:-160px;background:#C5EEF6}
#app{max-width:560px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
.view{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ic{width:1.35rem;height:1.35rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:1.05rem;height:1.05rem}.ic.lg{width:1.7rem;height:1.7rem}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 2px 10px}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--p1)}
h1{margin:2px 0 0;font-size:1.7rem;line-height:1.2;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:1.12rem;font-weight:700}
.sub{color:var(--mut);font-size:.92rem}
.icbtn{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh1);color:var(--ink2);transition:transform .15s}
.icbtn:active{transform:scale(.92)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 12px}
.sec .lnk{font-size:.86rem;font-weight:600;color:var(--p1)}

/* surfaces */
.card{background:var(--card);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-radius:var(--r);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.95);padding:18px}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--sh1),inset 0 1px 0 #fff;padding:16px;text-align:left;transition:transform .18s,box-shadow .18s;display:block;width:100%}
.tile:active{transform:scale(.97)}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 20px;color:#fff;background:linear-gradient(135deg,#4C5EF5 0%,#7A55F2 55%,#A25AF0 100%);box-shadow:0 28px 50px -22px rgba(92,84,240,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.hero:before{content:"";position:absolute;width:260px;height:260px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.42),transparent 68%)}
.hero:after{content:"";position:absolute;width:200px;height:200px;left:-60px;bottom:-110px;border-radius:50%;background:radial-gradient(circle,rgba(39,195,230,.5),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:1.45rem;color:#fff;margin:6px 0 4px}
.hero p{margin:0;opacity:.88;font-size:.92rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:99px;font-weight:600;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.pri{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--shp),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sec2{background:var(--tint2);color:var(--p1)}
.btn.white{background:#fff;color:#4A44E0;box-shadow:0 12px 24px -10px rgba(20,20,80,.5)}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.okb{background:var(--okbg);color:#087F5B}.btn.warnb{background:var(--warnbg);color:#B26A00}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row.w{flex-wrap:wrap}.sp{flex:1}
.gap8{gap:8px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}

/* chips & seg */
.chip{padding:9px 14px;border-radius:99px;background:var(--tint);color:var(--ink2);font-size:.9rem;font-weight:500;transition:all .18s}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 18px -8px rgba(85,104,255,.7)}
.seg{display:flex;background:rgba(255,255,255,.7);border-radius:99px;padding:4px;box-shadow:var(--sh1),inset 0 1px 0 #fff;backdrop-filter:blur(14px)}
.seg button{flex:1;padding:10px 6px;border-radius:99px;font-size:.9rem;font-weight:600;color:var(--mut);transition:all .2s}
.seg button.on{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 16px -8px rgba(85,104,255,.7)}
.lab{font-size:.82rem;font-weight:600;color:var(--mut);margin:18px 2px 8px;letter-spacing:.02em}

/* stats */
.stat{padding:14px 14px 12px;border-radius:22px;background:var(--card);box-shadow:var(--sh1),inset 0 1px 0 #fff}
.stat b{display:block;font-size:1.55rem;line-height:1.1;font-weight:700}
.stat span{font-size:.78rem;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;gap:10px;min-height:118px}
.mode .bub{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff}
.mode b{font-size:1rem}.mode small{color:var(--mut);font-size:.8rem;line-height:1.35}
.g1{background:linear-gradient(135deg,#5568FF,#7C7BFF)}.g2{background:linear-gradient(135deg,#14B8A6,#3BD6BC)}.g3{background:linear-gradient(135deg,#F59E0B,#FFC05C)}.g4{background:linear-gradient(135deg,#EC5B83,#FF8FA8)}
.bar{height:8px;border-radius:99px;background:var(--tint2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.mrow+.mrow{box-shadow:0 -1px 0 var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--ink2)}

/* tabbar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;padding:7px;border-radius:99px;background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 22px 44px -14px rgba(34,48,120,.35),0 2px 6px rgba(34,48,120,.08),inset 0 1px 0 #fff;width:min(calc(100% - 28px),500px);transition:transform .3s,opacity .3s}
.tabbar.hide{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:99px;font-size:.68rem;font-weight:600;color:var(--soft);transition:all .25s}
.tabbar button.on{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--shp)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.qprog{height:7px;border-radius:99px;background:rgba(255,255,255,.8);box-shadow:inset 0 1px 2px rgba(34,48,120,.1);overflow:hidden;margin-bottom:14px}
.qprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p3),var(--p1),var(--p2));transition:width .4s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;padding:8px 13px;border-radius:99px;background:var(--card);box-shadow:var(--sh1);display:flex;align-items:center;gap:6px}
.timer.low{color:var(--bad);background:var(--badbg)}
.qcard{padding:22px 20px;border-radius:30px;box-shadow:var(--sh2),inset 0 1px 0 #fff}
.qtext{font-size:1.1rem;font-weight:600;line-height:1.6;margin:12px 0 0}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 14px;border-radius:20px;background:var(--card);box-shadow:var(--sh1),inset 0 1px 0 #fff;transition:transform .15s,background .25s,box-shadow .25s}
.opt:active{transform:scale(.985)}
.opt .lt{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;background:var(--tint2);color:var(--p1);transition:all .25s}
.opt .tx{flex:1;padding-top:4px;font-size:.98rem;line-height:1.5}
.opt.sel{background:#EEF0FF;box-shadow:0 12px 24px -12px rgba(85,104,255,.55)}
.opt.sel .lt{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.opt.ok{background:var(--okbg);box-shadow:0 12px 24px -14px rgba(15,181,134,.7)}.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);box-shadow:0 12px 24px -14px rgba(239,79,103,.6)}.opt.bad .lt{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt .ic{margin-top:6px}
.fb{margin-top:16px;padding:16px 18px;border-radius:22px;animation:rise .3s both}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b{display:flex;align-items:center;gap:8px;margin-bottom:4px}.fb.ok b{color:#087F5B}.fb.bad b{color:#C2263F}
.fb p{margin:0;font-size:.92rem;color:var(--ink2)}
.qbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),520px);z-index:20;display:flex;gap:10px;align-items:center;padding:8px;border-radius:99px;background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 22px 44px -14px rgba(34,48,120,.35),inset 0 1px 0 #fff}
.qbar .btn{min-height:48px}
.navbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--ink2);flex:none}
.navbtn[disabled]{opacity:.35}
.cnt{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:10px;border-radius:99px;background:var(--tint)}
.flagon{color:var(--warn)!important;background:var(--warnbg)!important}.bmon{color:var(--p1)!important;background:var(--tint2)!important}
.nvgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
.nv{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:.95rem;background:var(--tint);color:var(--mut);position:relative}
.nv.a{background:#E4E8FF;color:var(--p1)}.nv.c{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:var(--shp)}
.nv.f:after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* results */
.ringwrap{display:grid;place-items:center;padding:8px 0 4px;position:relative}
.ringtxt{position:absolute;text-align:center}
.ringtxt b{font-size:2.6rem;line-height:1;font-weight:700;display:block}
.ringtxt span{font-size:.85rem;color:var(--mut)}
.rv{padding:16px 0}.rv+.rv{box-shadow:0 -1px 0 var(--line)}
.rv .q{font-weight:600;font-size:.97rem;line-height:1.55}
.ans{font-size:.88rem;margin-top:8px;padding:10px 12px;border-radius:14px}
.ans.ok{background:var(--okbg);color:#087F5B}.ans.bad{background:var(--badbg);color:#B3243B}.ans.na{background:var(--tint);color:var(--mut)}
.exp{font-size:.88rem;color:var(--ink2);margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--tint)}

/* written */
.ta{width:100%;min-height:150px;border:0;outline:0;resize:vertical;border-radius:22px;padding:16px 18px;background:#fff;box-shadow:inset 0 2px 6px rgba(34,48,120,.08),0 0 0 0 rgba(85,104,255,0);line-height:1.65;font-size:1rem;transition:box-shadow .2s}
.ta:focus{box-shadow:inset 0 2px 6px rgba(34,48,120,.06),0 0 0 4px rgba(85,104,255,.18)}
.kp{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:.82rem;font-weight:600;margin:0 6px 8px 0}
.kp.y{background:var(--okbg);color:#087F5B}.kp.n{background:var(--warnbg);color:#B26A00}
.model{padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#EEF1FF,#F5EEFF);font-size:.92rem;color:var(--ink2)}
.rb{display:flex;gap:12px;align-items:flex-start;padding:12px 0;text-align:left;width:100%}
.rb+.rb{box-shadow:0 -1px 0 var(--line)}
.cb{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--tint2);color:transparent;transition:all .2s;margin-top:1px}
.rb.on .cb{background:linear-gradient(135deg,var(--ok),#3BD6A8);color:#fff;box-shadow:0 6px 14px -6px rgba(15,181,134,.7)}
.rb span{font-size:.93rem;line-height:1.5}

/* cards */
.fc{perspective:1200px;margin-top:6px}
.fci{position:relative;height:340px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.fc.flip .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:32px;padding:26px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--sh2),inset 0 1px 0 #fff;background:#fff}
.face.back{transform:rotateY(180deg);background:linear-gradient(145deg,#4C5EF5,#8456F2);color:#fff;box-shadow:0 30px 56px -22px rgba(92,84,240,.8)}
.face h3{margin:10px 0 0;font-size:1.45rem;line-height:1.35}
.face .hint{position:absolute;bottom:20px;font-size:.78rem;color:var(--soft)}
.face.back p{font-size:1.04rem;line-height:1.7;margin:10px 0 0}

/* misc */
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(24,32,70,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.sheet{width:min(100%,560px);max-height:88vh;overflow:auto;background:rgba(255,255,255,.96);border-radius:32px 32px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -30px 60px -20px rgba(24,32,70,.4);animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.sheet.mid{border-radius:32px;margin:0 16px 16px;width:min(calc(100% - 32px),520px)}
.grab{width:42px;height:5px;border-radius:99px;background:#D8DDEE;margin:0 auto 14px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:99px;background:rgba(20,28,54,.92);color:#fff;font-size:.9rem;font-weight:500;box-shadow:0 18px 36px -12px rgba(0,0,0,.5);animation:rise .3s both}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .ic{width:2.6rem;height:2.6rem;color:var(--soft);margin-bottom:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:.76rem;font-weight:600;color:var(--mut)}
.badge i{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;background:var(--tint);color:var(--soft)}
.badge.on i{color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:var(--shp)}.badge.on{color:var(--ink)}
.days{display:flex;gap:6px;justify-content:space-between}
.days i{flex:1;height:34px;border-radius:12px;background:var(--tint)}
.days i.l1{background:#D4DAFF}.days i.l2{background:#9FAEFF}.days i.l3{background:linear-gradient(135deg,var(--p1),var(--p2))}
.switch{width:52px;height:30px;border-radius:99px;background:#D6DBEC;position:relative;transition:background .25s;flex:none}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .25s}
.switch.on{background:linear-gradient(135deg,var(--p1),var(--p2))}.switch.on:after{transform:translateX(22px)}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left}
.set+.set{box-shadow:0 -1px 0 var(--line)}
.dinput{border:0;outline:0;background:var(--tint);padding:12px 14px;border-radius:16px;font-size:.95rem}
.back-h{display:flex;align-items:center;gap:12px;padding:20px 0 6px}
.lh{line-height:1.6}.c-mut{color:var(--mut)}.fs9{font-size:.9rem}.fs8{font-size:.8rem}.b{font-weight:700}.tc{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){#app{padding-top:20px}}

/* ===== Final edition ===== */
.tbl{border-radius:16px;background:#fff;box-shadow:var(--sh1);overflow:hidden;font-size:.84rem;min-width:0}
.tbl .th{padding:8px 12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));word-break:break-word}
.tbl.fact .th{background:linear-gradient(135deg,#1F2A5C,#34408A)}.tbl.main .th{background:linear-gradient(135deg,#0E8FB8,#3B6FE8)}
.tbl .tr{padding:5px 12px;border-top:1px solid var(--line);word-break:break-word}
.tbl .tr.pk{background:#FFF7E0;font-weight:700}.tbl .tr.fk{background:#EAF4FF;font-weight:600;color:#1B5FA8}.tbl .tr.rep{background:#FDEBEE;color:#B3243B}
.sm{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:99px;background:rgba(85,104,255,.12);color:var(--p1);margin-left:4px}
.sm.pk{background:#FFE7A3;color:#8A5A00}.sm.fk{background:#CFE5FF;color:#1B5FA8}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:start}
.dd{margin-bottom:8px}.dd summary{cursor:pointer;padding:10px 12px;border-radius:14px;background:var(--tint);list-style:none}.dd summary::-webkit-details-marker{display:none}.dd[open] summary{margin-bottom:8px}
details.card summary{cursor:pointer;list-style:none}details.card summary::-webkit-details-marker{display:none}
.scrollx{overflow-x:auto;margin:8px -4px;-webkit-overflow-scrolling:touch}
table.mt{border-collapse:separate;border-spacing:0;font-size:.8rem;min-width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sh1)}
.mt th{background:var(--tint2);color:var(--ink2);text-align:left;padding:8px 10px;white-space:nowrap}.mt td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}

}

function finish() {

function gradeSA(q, text) {
  const t = String(text).toLowerCase();
  const hits = q.g.map(([n, r]) => { let ok = false; try { ok = new RegExp(r, 'i').test(t); } catch (e) {} return { n, ok }; });
  const h = hits.filter(x => x.ok).length;
  return { hits, score: Math.min(1, h / q.need) };
}

const tcard = (name, rows, cls = '') => `<div class="tbl ${cls}"><div class="th">${esc(name)}</div>${rows.map(([t, c]) => `<div class="tr ${c || ''}">${t}</div>`).join('')}</div>`;
function schemaHtml(key) {
  const s = SCHEMAS[key]; if (!s) return '';
  const fact = tcard(s.fact.name, [...s.fact.fks.map(f => [esc(f) + ' <span class="sm">FK</span>', 'fk']), ...s.fact.measures.map(m => [esc(m)])], 'fact');
  const dims = s.dims.map(d => `<details class="dd"><summary><b>${esc(d.name)}</b> <span class="sm">${d.attrs.length} attributes</span></summary>${tcard(d.name, [[esc(d.pk) + ' <span class="sm">PK</span>', 'pk'], ...d.attrs.map(a => [esc(a)])])}</details>`).join('');
  return `<div class="sch"><div class="sub" style="margin:0 0 8px"><b>${esc(s.title)}</b> · แตะ Dimension เพื่อดู Attribute</div>${fact}<div class="mt12">${dims}</div></div>`;
}
const topicChips = (sel, act) => {
  const b = (v, l, on) => `<button class="chip ${on ? 'on' : ''}" data-a="${act}" data-v="${v}">${esc(l)}</button>`;
  return `<div class="row w gap8">${b('__final', 'เนื้อหา Final ทั้งหมด', GF.every(x => sel.includes(x)) && !GM.some(x => sel.includes(x)))}${b('__mid', 'รวมทบทวนกลางภาค', GM.every(x => sel.includes(x)))}${b('__all', 'ทุกหัวข้อ', sel.length === ALLT.length)}</div>
  <div class="lab">เนื้อหา Final</div><div class="row w gap8">${GF.map(id => b(id, topic(id).short, sel.includes(id))).join('')}</div>
  <div class="lab">ทบทวนกลางภาค</div><div class="row w gap8">${GM.map(id => b(id, topic(id).short, sel.includes(id))).join('')}</div>`;
};
const togTopics = (arr, v) => {
  if (v === '__final') return GF.slice();
  if (v === '__all') return ALLT.slice();
  if (v === '__mid') return GM.every(x => arr.includes(x)) ? arr.filter(x => !GM.includes(x)).length ? arr.filter(x => !GM.includes(x)) : GF.slice() : [...new Set(arr.concat(GM))];
  return arr.includes(v) ? (arr.length > 1 ? arr.filter(x => x !== v) : arr) : arr.concat(v);

    const Qt = c.scope === 'final' ? { f1: 8, t6: 6, f2: 12, f3: 10, f4: 8, f5: 6 } : { f1: 6, t6: 4, f2: 10, f3: 8, f4: 7, f5: 5, mid: 10 };
    let ids = [];
    Object.entries(Qt).forEach(([t, n]) => { const pool = t === 'mid' ? MCQ.filter(q => GM.includes(q.t)) : MCQ.filter(q => q.t === t); ids = ids.concat(shuffle(pool).slice(0, n).map(q => q.id)); });
    if (ids.length < 50) ids = ids.concat(shuffle(MCQ.filter(q => !ids.includes(q.id) && (c.scope === 'all' || GF.includes(q.t)))).slice(0, 50 - ids.length).map(q => q.id));
    ids = shuffle(ids).slice(0, 50);
    db.sess = newSess(ids, { mode: 'exam', kind: 'mock', limit: c.mins * 60, title: 'สอบจำลอง Final' }); save(); go('quiz');
  },
  /* learn / lesson */
  lesson: el => { S.les = +el.dataset.v; S.lq = {}; S.ba = false; go('lesson'); },
  lnext: () => { if (S.les < LESSON.length - 1) { S.les++; db.les = Math.max(db.les || 0, S.les); save(); S.ba = false; render(); window.scrollTo(0, 0); } else { db.les = 9; save(); go('learn'); } },
  lprev: () => { if (S.les > 0) { S.les--; S.ba = false; render(); window.scrollTo(0, 0); } },
  lq: el => { const [i, v] = el.dataset.v.split(':'); S.lq[+i] = +v; hap(); render(true); },
  ba: el => { S.ba = el.dataset.v === '1'; render(true); },
  /* lab */
  labopen: el => { S.lab = { id: el.dataset.v, di: 0, sel: {}, chk: {}, fk: {}, fkChk: {}, jn: { star: '', snow: '' }, jchk: false }; go('lab'); },
  labdim: el => { S.lab.di = +el.dataset.v; go('labrun'); },
  labback: () => go('lab'),
  labcheck: () => { S.lab.chk[S.lab.di] = true; const E = labEx(), sc = labScore(E.dims[S.lab.di], S.lab.sel[S.lab.di] || {}); db.lab[E.id] = db.lab[E.id] || { best: null, dims: {} }; db.lab[E.id].dims = db.lab[E.id].dims || {}; db.lab[E.id].dims[S.lab.di] = Math.max(sc.pct, db.lab[E.id].dims[S.lab.di] || 0); save(); hap(); render(true); window.scrollTo(0, 0); },
  labfkchk: () => { S.lab.fkChk[S.lab.di] = true; render(true); },
  labjoin: () => { S.lab.jn.star = ($('#jstar') || {}).value; S.lab.jn.snow = ($('#jsnow') || {}).value; S.lab.jchk = true; render(true); },
  labfinish: () => { const E = labEx(), tot = Math.round(E.dims.reduce((s, d, i) => s + labScore(d, S.lab.sel[i] || {}).pct, 0) / E.dims.length); const o = db.lab[E.id] || { dims: {} }; o.best = Math.max(tot, o.best || 0); o.ts = Date.now(); db.lab[E.id] = o; db.hist.push({ ts: Date.now(), type: 'lab', title: 'แบบฝึก: ' + E.title, n: 100, ok: tot, pct: tot, secs: 0 }); save(); toast('บันทึกผลแล้ว ' + tot + '%'); go('learn'); },
  /* tools */
  tools: el => { S.tool = el.dataset.v; go('tools'); },
  aggpre: el => { const v = el.dataset.v; S.agg = v === 'slide' ? { a1: 4000, a2: 300, a3: 1825, b1: 80, b2: 300, b3: 1825, sp: 50 } : v === 'hotel' ? { a1: 150, a2: 6, a3: 730, b1: 12, b2: 6, b3: 730, sp: 100 } : { a1: 20000, a2: 200, a3: 1095, b1: 50, b2: 200, b3: 1095, sp: 100 }; render(true); },
  clsans: el => { S.cls.ans = +el.dataset.v; const c = S.cls.cur, n = (c.p > 0) + (c.s > 0) + (c.t > 0); S.cls.n++; if (S.cls.ans === n) S.cls.ok++; hap(); render(true); },
  clsnext: () => { newCls(); render(true); },
  /* essay */
  essay: el => { const id = el.dataset.v, pv = db.essay[id]; S.es = { id, i: 0, txts: (pv && pv.txts) || {}, ticks: {}, checked: false, used: 0, mock: false }; go('essay'); },
  mockEssay: () => { S.es = { id: 'x1', i: 0, txts: {}, ticks: {}, checked: false, used: 0, mock: true }; go('essay'); },
  espart: el => { saveEs(); S.es.i = +el.dataset.v; render(true); window.scrollTo(0, 0); },
  esnext: () => { saveEs(); if (S.es.i < ESSAY.find(x => x.id === S.es.id).parts.length - 1) S.es.i++; render(true); window.scrollTo(0, 0); },
  esprev: () => { saveEs(); if (S.es.i > 0) S.es.i--; render(true); window.scrollTo(0, 0); },
  esCheck: () => { saveEs(); const es = S.es, E = ESSAY.find(x => x.id === es.id); const len = E.parts.reduce((s, P) => s + (es.txts[P.id] || '').trim().length, 0); if (len < 30) return toast('เขียนคำตอบก่อนนะ'); E.parts.forEach(P => { es.ticks[P.id] = autoTicksP(P, es.txts[P.id]); }); es.checked = true; cleanup(); render(); window.scrollTo(0, 0); },
  esTick: el => { const [pi, i] = el.dataset.v.split(':').map(Number), E = ESSAY.find(x => x.id === S.es.id), P = E.parts[pi]; const a = S.es.ticks[P.id] || (S.es.ticks[P.id] = []); a[i] = !a[i]; hap(); render(true); },
  esBack: () => { S.es.checked = false; S.es.i = 0; render(); },
  esDone: () => {
    const es = S.es, E = ESSAY.find(x => x.id === es.id), r = essayScore(E, es), pct = r.pct;
    db.essay[es.id] = { pct, ts: Date.now(), txts: es.txts };
    if (es.mock) { const s = db.last; if (s && s.hist) { s.hist.essayPct = pct; const h = db.hist[db.hist.length - 1]; if (h && h.ts === s.hist.ts) { h.essayPct = pct; h.pct = Math.round((h.mcqPct + pct) / 2); } S.res = s; } save(); toast('บันทึกผลสอบจำลองแล้ว'); go('result'); }
    else { db.hist.push({ ts: Date.now(), type: 'essay', title: 'ข้อเขียน: ' + E.title, n: E.pts, ok: Math.round(r.got), pct, secs: es.used }); save(); toast('บันทึกคะแนนแล้ว'); go('practice', { ptab: 'sa' }); }
  },
  exites: () => ask('ออกจากข้อเขียน', 'ข้อความที่เขียนไว้จะถูกเก็บเป็นร่างเฉพาะโหมดฝึก', 'ออก', () => { saveEs(); if (S.es && !S.es.mock) { db.essay[S.es.id] = Object.assign(db.essay[S.es.id] || {}, { txts: S.es.txts }); save(); } cleanup(); go(S.es && S.es.mock ? 'result' : 'practice', { ptab: 'sa' }); })
});
function saveEs() { const t = $('#estxt'); if (t && S.es && !S.es.checked) { const E = ESSAY.find(x => x.id === S.es.id); S.es.txts[E.parts[S.es.i].id] = t.value; } }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('labsel')) { const L = S.lab; (L.sel[L.di] = L.sel[L.di] || {})[t.dataset.attr] = t.value; hap(); }
  if (t.classList.contains('labfk')) { const L = S.lab; (L.fk[L.di] = L.fk[L.di] || {})[t.dataset.slot] = t.value; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.agg) { S.agg[t.dataset.agg] = +t.value || 0; const o = $('#aggout'); if (o) o.innerHTML = aggOut(); }
  if (t.dataset.fun !== undefined) { S.fun[+t.dataset.fun] = +t.value || 0; const o = $('#funout'); if (o) o.innerHTML = funOut(); }
});
